name: Release

# Push a tag like v0.0.1 (it must match __version__ in iuk_netscope.py) to build and publish
# the .deb, .rpm and Windows .exe as a GitHub Release.  "Run workflow" builds the same files as
# downloadable artifacts without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-packages:
    name: Build DEB and RPM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the code version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V="$(python3 packaging/version.py)"
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ (v$V). Fix the version or re-tag."
            exit 1
          fi

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm python3-tk python3-reportlab nmap xvfb iputils-ping iproute2 dnsutils

      - name: Tests
        run: |
          python3 -m unittest discover -s tests -v
          xvfb-run -a python3 tests/gui_smoke.py

      - name: Build DEB
        run: bash packaging/build_deb.sh

      - name: Build RPM
        run: bash packaging/build_rpm.sh

      - name: Verify packages
        run: |
          sudo apt-get install -y ./dist/*.deb
          iuk-netscope --version
          rpm -qp --requires dist/*.rpm | grep -q '^nmap'
          dpkg-deb -f dist/*.deb Depends | grep -q nmap

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: error

  windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        shell: pwsh
        run: |
          python -m pip install reportlab
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed" }

      - name: Build executables
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Smoke test the executables
        shell: pwsh
        run: |
          dist\iuk-netscope-cli.exe --version
          if ($LASTEXITCODE -ne 0) { throw "CLI --version failed" }
          dist\iuk-netscope-cli.exe --no-color quick
          if ($LASTEXITCODE -ne 0) { throw "CLI quick failed" }
          dist\iuk-netscope-cli.exe --no-color ping 127.0.0.1 -c 2
          if ($LASTEXITCODE -ne 0) { throw "CLI ping failed" }
          $p = Start-Process -FilePath "dist\IUK-NetScope.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "GUI exe exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force

      - name: Package
        shell: pwsh
        run: |
          $v = (python packaging/version.py).Trim()
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist\IUK-NetScope.exe, dist\iuk-netscope-cli.exe, README.md, LICENSE pkg\
          Compress-Archive -Path pkg\* -DestinationPath "dist\IUK-NetScope-$v-windows-x64.zip" -Force
          Copy-Item dist\IUK-NetScope.exe "dist\IUK-NetScope-$v-windows-x64.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/IUK-NetScope-*-windows-x64.zip
            dist/IUK-NetScope-*-windows-x64.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [linux-packages, windows-exe]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
